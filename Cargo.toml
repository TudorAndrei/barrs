[package]
name = "barrs"
version = "0.2.6"
edition = "2024"

[dependencies]
libc = "0.2"
mlua = { version = "0.10", features = ["lua54", "serialize", "vendored", "send"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
tokio = { version = "1.44", features = ["macros", "net", "rt", "sync", "io-util", "time"] }
usage = { package = "usage-rs", version = "6.11" }

[dev-dependencies]
tempfile = "3.13"

[lints.clippy]
pedantic = { level = "deny", priority = -1 }
nursery = { level = "deny", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
indexing_slicing = "deny"
arithmetic_side_effects = "deny"
unreachable = "deny"
unimplemented = "deny"
unchecked_time_subtraction = "deny"
todo = "deny"
string_slice = "deny"
panic_in_result_fn = "deny"
panic = "deny"
exit = "deny"
as_conversions = "deny"

[profile.release]
codegen-units = 1
lto = true
opt-level = "z"
panic = "abort"
strip = true

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3.2", features = ["NSApplication", "NSColor", "NSControl", "NSEvent", "NSFont", "NSGraphics", "NSPanel", "NSResponder", "NSRunningApplication", "NSScreen", "NSTextField", "NSView", "NSWindow", "objc2-core-graphics"] }
objc2-core-graphics = { version = "0.3.2", features = ["CGDirectDisplay", "CGDisplayConfiguration", "CGError"] }
objc2-foundation = { version = "0.3.2", features = ["NSGeometry", "NSString"] }
