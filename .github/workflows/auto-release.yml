name: auto-release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  actions: write
  contents: write

concurrency:
  group: auto-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: release-from-conventional-commits
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'workflow_dispatch' || (
        github.actor != 'github-actions[bot]' &&
        !startsWith(github.event.head_commit.message, 'chore(version): ') &&
        !startsWith(github.event.head_commit.message, 'chore(brew): ')
      )

    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ github.event.repository.default_branch }}

      - name: Install release toolchain
        uses: jdx/mise-action@v3
        with:
          cache: true
          install: true

      - name: Configure release identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Cut release
        run: mise run release-auto

      # Tags pushed with GITHUB_TOKEN do not start other workflows.
      - name: Start release build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="$(git tag --points-at HEAD --list 'v*')"
          if [ -n "${tag}" ]; then
            gh workflow run release.yml --ref "${tag}" -f "tag=${tag}"
          fi
