name: ci

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  rust:
    name: rust
    runs-on: macos-15

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Install pinned Rust toolchain
        run: rustup toolchain install

      - name: Install pinned Nextest
        uses: jdx/mise-action@v3
        with:
          install_args: cargo:cargo-nextest

      - name: Set up shared build cache
        uses: jdx/mr-boxington-action@v1
        with:
          version: "1.23.0"
          toolchain: "1.97.1"

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Lint all targets
        run: mbx clippy --all-targets -- -D warnings

      - name: Check all targets
        run: mbx check --all-targets --locked

      - name: Run unit tests with Nextest
        run: mbx nextest run --locked

      - name: Run Cucumber features
        run: mbx test --locked --test config --test daemon

      - name: Run documentation tests
        run: mbx test --locked --doc
