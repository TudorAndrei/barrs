name: ci

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  rust:
    name: rust
    runs-on: macos-14

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Install pinned Rust toolchain
        run: rustup toolchain install

      - name: Set up shared build cache
        uses: jdx/mr-boxington-action@v1
        with:
          version: "1.19.0"
          toolchain: "1.97.1"

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Lint all targets
        run: mbx clippy --all-targets -- -D warnings

      - name: Check all targets
        run: mbx check --all-targets --locked

      - name: Run tests
        run: mbx test --locked
