[tools]
rust = "1.97.1"
cocogitto = "7.0.0"
"cargo:cargo-release" = "1.1.2"

[tools."github:TudorAndrei/criv"]
version = "0.7.0"

[tools."github:TudorAndrei/criv".platforms]
macos-arm64 = { asset_pattern = "criv-aarch64-apple-darwin.tar.gz" }
linux-arm64 = { asset_pattern = "criv-aarch64-unknown-linux-gnu.tar.gz" }
linux-x64 = { asset_pattern = "criv-x86_64-unknown-linux-gnu.tar.gz" }
windows-x64 = { asset_pattern = "criv-x86_64-pc-windows-msvc.zip" }

[tasks.release-plan]
description = "Show the next release version from conventional commits"
run = "cog bump --dry-run --auto"

[tasks.release-auto]
description = "Cut a release from conventional commits"
run = "bash scripts/release-auto.sh"

[tasks.check]
description = "Run the full locked Rust quality gate"
run = "cargo fmt --all -- --check && cargo clippy --all-targets -- -D warnings && cargo check --all-targets --locked && cargo test --locked"
