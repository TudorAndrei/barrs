tag_prefix = "v"
from_latest_tag = true
ignore_merge_commits = true
branch_whitelist = ["main"]

# `cog bump` commits and tags; the hooks keep Cargo metadata and the binary in step.
pre_bump_hooks = [
  "cargo release version {{version}} --execute --no-confirm",
  "cargo test",
  "cargo run -- --version | grep -Fx 'barrs {{version}}'",
]
post_bump_hooks = [
  "git push origin main {{version_tag}}",
]

[commit_types]
chore = { changelog_title = "Miscellaneous Chores", omit_from_changelog = true }

[changelog]
path = "CHANGELOG.md"
template = ".cog/changelog.tera"
remote = "github.com"
owner = "TudorAndrei"
repository = "barrs"
